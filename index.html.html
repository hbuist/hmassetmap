<!-- the following is from Geeks for Geeks articles https://www.geeksforgeeks.org/html/add-google-maps-marker-website/ | https://www.geeksforgeeks.org/javascript/how-to-add-click-event-to-google-map-markers-stored-in-an-array-in-javascript/ gratefully with the help of my mum who is a programmer because it was complex :) -->
   
 <script src=
"https://maps.googleapis.com/maps/api/js?key=AIzaSyAn6bsoVLHexE4Q6YI3ATVrSGr3I3Y9E2w&callback=initMap">
    </script>
   
<body>
    <div id="map" style="width: 100%; height: 400px;"></div>

 <script>
       
        var map = new google
            .maps.Map(document.getElementById('map'), {zoom: 15,
                center: { lat: 45.40507280619526, lng: -75.72430572161323 }});
       
	 // Create an array of markers
        var markers = [
            new google.maps.Marker({position: 
		{lat: 45.401696635980606,
		lng: -75.72622213047354 }, map: map, url: "categories.html#social" }),
            new google.maps.Marker({position: 
		{lat: 45.40378057746859,
                 lng: -75.72443950757564 }, map: map, url: "https://www.google.ca/" }),
	    new google.maps.Marker({position: 
		{lat: 45.408252275432915,
                 lng: -75.72890359272752 }, map: map, url: "https://www.google.ca/" }),
            new google.maps.Marker({ position: 
		{lat: 45.40805579851303,
                 lng: -75.72247013552438 }, map: map, url: "https://www.google.ca/" })	
			];


       // Iterate over the array of markers
        for (var i = 0; i < markers.length; i++) {
            // Bind a click event to the current marker
            markers[i].addListener('click', function () {
		alert ('information')
                window.location.href = this.url ;
            });
        }
    </script>

   
<!-- end of Geeks for Geeks coding -->
